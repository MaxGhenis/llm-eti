[project]
name = "llm-eti"
version = "0.2.0"
description = "Reproducible analysis of archived LLM taxable-income responses"
authors = [
    {name = "Jason DeBacker", email = "jason.debacker@moore.sc.edu"},
    {name = "Max Ghenis"},
]
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.12,<3.14"
keywords = ["large language models", "public finance", "taxable income"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fonttools==4.63.0",
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "pandas>=2.3,<3",
    "pillow==12.3.0",
    "statsmodels>=0.14.5,<0.15",
    "tabulate>=0.9,<1",
]

[build-system]
# Latest stable release verified from the PyPI JSON API on 2026-07-09.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_eti"]

[tool.hatch.build.targets.sdist]
exclude = [
    "data/**",
    "_site/**",
    "paper/site_libs/**",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["llm_eti"]

[dependency-groups]
dev = [
    "black>=24.10,<26",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]
