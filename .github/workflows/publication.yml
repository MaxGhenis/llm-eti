name: Publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Newest-wins per ref: without this, two close pushes can finish building out
# of order and the older run's Pages deploy would land last.
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Test (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check locked dependencies
        run: uv lock --check

      - name: Install locked Python environment
        run: uv sync --python 3.12 --frozen --group dev

      - name: Run the offline test suite
        run: uv run --python 3.12 pytest -q

      - name: Build and smoke-test distributions
        run: |
          uv build --no-sources --clear
          uv run --python 3.12 python - <<'PY'
          import tarfile
          from pathlib import Path

          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              members = {
                  Path(name).parts[1]
                  for name in archive.getnames()
                  if len(Path(name).parts) > 1
          }
          allowed = {
              ".gitignore",
              "LICENSE",
              "NOTICE.md",
              "PKG-INFO",
              "README.md",
              "llm_eti",
              "pyproject.toml",
          }
          required = {
              "LICENSE",
              "NOTICE.md",
              "README.md",
              "llm_eti",
              "pyproject.toml",
          }
          if unexpected := members - allowed:
              raise SystemExit(f"Unexpected sdist paths: {sorted(unexpected)}")
          if missing := required - members:
              raise SystemExit(f"Missing sdist paths: {sorted(missing)}")
          PY
          uv venv --python 3.12 "${RUNNER_TEMP}/llm-eti-wheel-smoke"
          uv pip install \
            --python "${RUNNER_TEMP}/llm-eti-wheel-smoke/bin/python" \
            dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/llm-eti-wheel-smoke/bin/python" -I -c \
            "import llm_eti; print(llm_eti.__version__)"

  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1783555200"
      TZ: UTC

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check locked dependencies
        run: uv lock --check

      - name: Install poppler-utils for the PDF accessibility gate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.9.38"
          tinytex: true

      - name: Install locked Python environment
        run: uv sync --frozen --group dev

      - name: Build and verify publication
        run: make publication

      - name: Validate PDF/UA-2 conformance
        env:
          VERAPDF_IMAGE: >-
            verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb
        run: |
          report="${RUNNER_TEMP}/verapdf-report.xml"
          log="${RUNNER_TEMP}/verapdf.log"
          docker pull "${VERAPDF_IMAGE}"
          set +e
          docker run --rm --network none \
            --volume "${PWD}:/data:ro" \
            "${VERAPDF_IMAGE}" \
            --format xml --flavour ua2 _site/paper/llm-eti.pdf \
            > "${report}" 2> "${log}"
          status=$?
          set -e
          cat "${log}" >&2
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 1 ]; then
            echo "veraPDF could not complete (exit status ${status})." >&2
            exit "${status}"
          fi
          uv run --frozen python scripts/check_verapdf.py \
            "${report}" .github/verapdf-baseline.json

      - name: Upload verified publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-eti-publication
          path: _site
          if-no-files-found: error

      - name: Stage GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, python-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
