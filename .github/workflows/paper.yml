name: Paper tables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --no-editable --extra dev --python 3.13
      - run: make check-paper
